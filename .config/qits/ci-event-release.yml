# The release pipeline: this repository reacts to its OWN release and pushes the image under the
# released VERSION.
#
# THE SELECTION NAMES THIS REPOSITORY, WHICH READS LIKE A LOOP AND IS NOT. `SCMRelease` says only
# "source control has this version" — qits-projects' Auto Release publishes it once the release
# request's gate is green and the tag is written (SCMRelease and not SCMPublishTag: the git host's
# tag primitive fires no post-receive and announces nothing), and nothing in this file publishes it. So a repository listening for its own SCMRelease
# is exactly the release pipeline the split-release design asks each repository to own: the SCM half
# fires, this half builds the tagged commit and pushes it, and qits-ci turns the green run into one
# `SoftwareRelease` per entry under `artifacts:` below. The event that could loop is
# SoftwareRelease, and this file neither listens for it nor publishes it.
#
# THE VERSION TAG IS THE ONLY COORDINATE NOW. The `:$QITS_CI_SHA` push that rode the per-push
# pipeline went with per-push CI itself — the QA pipeline builds a fold and publishes no image — and
# the deployer deploys the VERSION, so this push is the whole contract with it.
#
# `artifacts:` IS A DECLARATION, NOT A REPORT. qits-ci never learns how to publish anything, so it
# cannot see what the step below pushed; it announces `{repository, version, packageType,
# packageName}` on the strength of these two lines. Keep them true.
#
# THE NAME IS UNQUALIFIED ON PURPOSE. No registry-qualified docker reference is portable here — the
# registry is one service under several addresses ($QITS_BUILD_REGISTRY as the platform builder
# resolves it, $QITS_REGISTRY as the host daemon does, `localhost:8081` outside) — and an OCI
# reference cannot carry a path prefix. So the declaration carries `qits/<application>` and the
# reader supplies its own host, exactly as the push below composes one from environment.
#
# THE BUILD BELOW IS THE QA PIPELINE'S, AND THE TWO MUST STAY MATCHED — byte for byte in every
# buildctl argument, because the platform builder's cache is shared and a matched build is what
# makes a release that follows a green fold a stack of cache hits rather than a second native
# compile. ci-event-release-request.yml builds the same image content at the fold and publishes
# nothing; that file explains the whole builder arrangement (`build: true`, the file-form secrets,
# why there is no `--network host` any more) and this one carries the short form. The one deliberate
# difference is the `--output`: this pipeline publishes, that one does not.
#
# THIS FILE IS INERT UNTIL AN SCMRelease FOR THIS REPOSITORY EXISTS, and it lands first on purpose: the
# bus is at-most-once with no catch-up and no replay, so a trigger file must be in place before the
# event it selects exists. The other order loses a release and looks like a train that quietly did
# not roll.
event: SCMRelease
when:
  - repository: { exact: qits-edge-platform-service }
# THE RUN IS ANCHORED AT THE TAG IT BUILDS. `SCMRelease` carries `commitSha` — the commit the tag
# points at — since qits-projects 2026.905.73500, and qits-ci resolves these two dot-paths since
# 2026.905.83431. Before that the event named no commit at all: `branch` is the release request's
# BACKING BRANCH, which the tagging operation deletes, and `version` names a tag rather than a
# commit — so this file could declare no `checkout:`, the run was recorded at `main`, and every
# release displayed as `main@<head>`, a run recorded against a commit it did not build.
#
# `branch: version` IS NOT A MISNOMER. The key is named for the run row's ref column, and a tag is a
# ref: the daemon clones `--branch "$QITS_CI_BRANCH"`, which git resolves against tags exactly as
# against heads, and the sha is what `checkout --detach` then lands on. Nothing in qits-ci holds a
# concept of a tag.
#
# `optional: true` IS THE TRANSITION AND IT STAYS UNTIL NO OLD EVENT CAN ARRIVE. `commitSha` is
# additive, so an `SCMRelease` published before it existed — a replay out of the durable log, a
# hand-built event through qits-ci's manual trigger door — resolves nothing here. Without the flag
# that would cost this pipeline its run, which is a released version whose artifact is silently
# never published. With it, such a run is recorded at `main`'s head, byte-for-byte as before, and
# the `git fetch refs/tags/$version` in the step below is what supplies the released tree — which
# is why that fetch STAYS: a no-op on the anchored path, the whole mechanism on the fallback one.
checkout:
  branch: version       # the tag's name — a ref name, which `clone --branch` resolves
  sha: commitSha        # what it points at; absent on any release published before the field
  optional: true        # ...and then this run is main's head, exactly as it was before
artifacts:
  - { type: docker, name: qits/qits-platform-edge }
steps:
    # node is here to read the event payload, which is JSON; buildctl to build and push.
    #
    # `build: true`, NOT `docker: true`: this step builds through the platform's own buildkitd and
    # wants no docker socket at all. See ci-event-release-request.yml and qits-buildkit-plan.md.
  - image: qits/build-images/node-docker-base:latest
    build: true
    timeout-seconds: 3600
    script: |
      # Without -e a failed build is swallowed and a green release run makes qits-ci announce an
      # artifact that was never pushed. -u makes an unset injected variable stop the step.
      set -eu

      # The builder and the registry AS THE BUILDER RESOLVES IT, both demanded loudly before
      # anything is built. Unset means a qits-ci/qits-containers pair too old to inject them; EMPTY
      # means the kill switch. ci-event-release-request.yml has the full note.
      : "${BUILDKIT_HOST:?the platform builder is off or not injected; this recipe builds only through it}"
      : "${QITS_BUILD_REGISTRY:?}"

      # THE EVENT, READ AS DATA. The payload reaches the container verbatim as one string in
      # $QITS_EVENT_PAYLOAD; there is no per-field projection.
      version=$(node -p 'JSON.parse(process.env.QITS_EVENT_PAYLOAD).version')
      # A version here is a calver or a semver, and nothing legitimate needs a character outside
      # this set. Refused rather than quoted, because it reaches a shell and a docker reference.
      case "$version" in
        ''|*[!0-9A-Za-z._+-]*) echo "refusing an implausible version: $version" >&2; exit 1 ;;
      esac
      echo "releasing qits/qits-platform-edge:$version"

      # THE TAG IS THE CHECKOUT TARGET, and it is the only reason this run needs one. An
      # event-triggered run is cloned at the head of main, which is where the release commit is
      # *now* — a later push moves that, and the tag does not, so a busy main cannot make this
      # pipeline ship a different tree than the one that was released. The clone is shallow and
      # carries no tags, hence the explicit refspec; the URL rather than `origin` because every
      # address a step needs arrives as environment.
      git fetch "$QITS_CI_REPOSITORY_URL" "refs/tags/$version:refs/tags/$version"
      git checkout --detach "$version"

      # The credential in FILE form on both sides: written here under umask 077 into /tmp — outside
      # the clone, so it cannot enter the build context — and mounted by the Dockerfile's mvnw RUN
      # as a bare file under /run/secrets. Never a --build-arg, which a pullable image's history
      # records, and never the `env=` mount form, which couples the recipe to the builder's
      # dockerfile frontend. Empty when a run commissioned nothing, which the settings read as
      # unset. ci-event-release-request.yml carries the same two files; keep them matched.
      umask 077
      printf '%s' "${QITS_COMMISSIONED_CLIENT_ID:-}" > /tmp/qits-client-id
      printf '%s' "${QITS_COMMISSIONED_CLIENT_SECRET:-}" > /tmp/qits-client-secret

      # NO --network host, AND NOTHING REPLACES IT: a `RUN` executes in the builder's own namespace
      # on qits-net, so the two addresses are the IN-NETWORK ones. The Maven repository build-arg is
      # NOT optional — this build resolves eu.wohlben.qits artifacts (qits-eventstream and its
      # integrations) and the pom's default spells an address no step container can reach — and
      # $QITS_MAVEN_REGISTRY_URL is that repository as anything on qits-net dials it, which now
      # includes the builder. $QITS_MAVEN_PROXY_URL is the Central pull-through's in-network route;
      # empty deactivates the settings profile and Central is resolved directly, as it always was.
      #
      # `push=true` IS THE PUBLISH: the image goes from the builder straight to the registry and
      # never enters any local image store — which is why there is no `docker rmi` question left,
      # and why the old note about a concurrent-build rmi race (the one that broke the release of
      # 2026-08-11) describes a store this pipeline no longer touches. $QITS_BUILD_REGISTRY is the
      # registry as the BUILDER resolves it; $QITS_REGISTRY stays the host daemon's view and is not
      # dialled here.
      ref="$QITS_BUILD_REGISTRY/$QITS_IMAGE_REPOSITORY/qits-platform-edge:$version"
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt build-arg:QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL" \
        --opt build-arg:QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}" \
        --secret id=qits-client-id,src=/tmp/qits-client-id \
        --secret id=qits-client-secret,src=/tmp/qits-client-secret \
        --output "type=image,name=$ref,push=true"

      # --- the SBOM -----------------------------------------------------------------------------
      # THE DOCUMENT GOES UP AFTER THE PUSH AND BEFORE THIS STEP EXITS GREEN. qits-ci announces
      # `SoftwareRelease` only for a green run, so ordering is the whole guarantee: no consumer is
      # ever told about a version whose bill of materials is missing. A failed PUT fails the release
      # ON PURPOSE — the store being down is not a reason to announce a version nobody can audit.
      # Only THIS pipeline uploads one: the QA pipeline publishes no image and announces no release,
      # so it owes no document.
      #
      # The second `buildctl build` reaches the Dockerfile's `sbom` stage — a `FROM scratch` holding
      # only the service module's CycloneDX document, exported with `type=local` instead of pushed.
      # Build-args and secrets are BYTE-IDENTICAL to the image build above, which is what makes
      # every layer a cache hit in the same builder and this export seconds rather than a second
      # native compile; a drift between the two invocations costs a full rebuild, not a wrong
      # document.
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt target=sbom \
        --opt build-arg:QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL" \
        --opt build-arg:QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}" \
        --secret id=qits-client-id,src=/tmp/qits-client-id \
        --secret id=qits-client-secret,src=/tmp/qits-client-secret \
        --output type=local,dest=.sbom
      # The SBOM store is a sibling path of the npm registry in the qits-platform-artifacts
      # deployment, so its root is DERIVED from $QITS_NPM_REGISTRY_URL — the qits-net alias, which
      # the launcher injects into every step container and which this one can dial directly. NOT
      # from $QITS_REGISTRY: that is the host-published name the docker daemon pushes through on
      # the far side of the mounted socket, and inside this container it answers curl with an
      # instant connection refusal (measured on qits-artifacts-service's 2026.902 releases). Not
      # the edge name either — THIS service is that edge, and it answers a sessionless write with
      # 401. The path names the DECLARED artifact identity verbatim: `artifacts:` above says
      # `{type: docker, name: qits/qits-platform-edge}`, and (packageType, packageName, version) is
      # how the SoftwareRelease consumer will ask for it.
      sbom_base="${QITS_NPM_REGISTRY_URL%%/artifacts/*}/artifacts/sboms"
      curl -fsS -X PUT -H 'Content-Type: application/vnd.cyclonedx+json' \
        --data-binary @.sbom/sbom.json \
        "$sbom_base/docker/qits/qits-platform-edge/-/$version"
