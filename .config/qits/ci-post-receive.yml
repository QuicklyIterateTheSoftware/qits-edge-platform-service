# The pipeline qits-ci runs on every push to a tracked branch of this repository.
#
# ONE STEP, and that is the whole shape. Unlike qits-gateway's, this pipeline has no client half:
# this service serves no page, so there is nothing to install from the platform's npm registry and
# nothing to prepare in the build context. The Dockerfile's builder stage does everything.
#
# Publish under the tag that is the whole contract with qits-platform-deployments —
# <registry>/<repository>/<this repo's name>:<sha>. The step's own container only drives the docker
# CLI; the build and the push happen in the host's daemon through the socket this step declares
# (docker: true).
#
# `set -eu` is load-bearing rather than tidy: the daemon runs this with `bash -c` and no -e, so
# without it an early failure is swallowed by the next command's exit code and the run reports
# SUCCESS. The deployer is then told an image exists that does not, which is the exact shape of
# the qits-workspaces IMAGE_MISSING incident. -u
# makes an unset registry variable stop the step too.
steps:
  - image: qits/build-images/ci-base:latest
    docker: true
    timeout-seconds: 3600
    script: |
      set -eu
      # The two --secret flags are the fleet's shape for a credential inside a build: the launcher
      # injects the run's commissioned idp client as
      # $QITS_COMMISSIONED_CLIENT_ID/$QITS_COMMISSIONED_CLIENT_SECRET, and a Dockerfile that needs it
      # mounts it on one RUN — never a --build-arg, which is recorded in a pullable image's history.
      # This build needs none: its Maven resolve is reactor-only over public repositories, so there
      # is no `.qits-maven-settings.xml` here and no mount to feed. Both halves are free — buildx
      # ignores a secret no RUN mounts, and a missing env source is NOT an error (measured on buildx
      # v0.36.1, the build runs green with the variable unset).
      ref="$QITS_REGISTRY/$QITS_IMAGE_REPOSITORY/qits-platform-edge:$QITS_CI_SHA"
      docker build \
        --secret id=qits-client-id,env=QITS_COMMISSIONED_CLIENT_ID \
        --secret id=qits-client-secret,env=QITS_COMMISSIONED_CLIENT_SECRET \
        -t "$ref" -f docker/Dockerfile .
      docker push "$ref"
      # NO `docker rmi "$ref"`: on a CI host it frees nothing — the layers stay in the builder's
      # cache either way — while under the containerd image store it drops the last reference to
      # content a concurrent build of this same Dockerfile may still be resolving. Two builds of
      # this one Dockerfile do run concurrently, main's and environment/dev's, which is the race
      # that broke the release of 2026-08-11.

  # The self-release door: a push to maintenance/* asks qits-workspaces to release the branch
  # once the build step above is green. The sibling-standard step, verbatim from qits-gateway;
  # that recipe is where the pattern is maintained and the copies should keep matching.
  - image: qits/build-images/node-base:latest
    branches:
      - prefix: maintenance/
    timeout-seconds: 300
    script: |
      set -eu
      case "$QITS_CI_BRANCH" in
        maintenance/*) ;;
        *) echo "not a maintenance branch: $QITS_CI_BRANCH"; exit 1 ;;
      esac
      summary=$(git log -1 --format=%s)
      node -e '
        const [url, branch, summary] = process.argv.slice(1);
        fetch(url, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ branch, summary }),
        }).then(async (res) => {
          const text = await res.text();
          let body = {};
          try { body = JSON.parse(text); } catch {}
          if (res.ok) {
            console.log(`released ${body.version} as ${body.commitSha} from ${body.branch}`);
            return;
          }
          if (res.status === 409 && body.reason === "ALREADY_INTEGRATED") {
            console.log(`${branch} is already released - nothing to do`);
            return;
          }
          console.error(`release refused: HTTP ${res.status} ${text}`);
          process.exit(1);
