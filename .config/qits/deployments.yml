# How qits-platform-deployments deploys this repo. It reads this file from the git host at the built
# sha, so the answer travels with the commit rather than living in the deployer's database.
#
# ENVIRONMENT-tiered, so the deploy branch is the tier convention `environment/<name>` — for the
# prod tier, `environment/prod`. `main` stays the integration trunk and ships nothing.
#
# THE ONE THING TO CHECK BEFORE THIS RUNS BEYOND ONE TIER. This process reaches
# `<env>-qits-gateway` for EVERY environment in `qits.edge.environments`, and an environment service
# joins its own tier's networks. A single-environment platform is unaffected; the day a second
# environment is added, either this becomes `deployment_target: platform` (which joins every
# environment's per-application networks unconditionally) with an explicit `branch:`, or the edge
# has to be joined to the other tiers by hand. Stated here rather than discovered as a 502.
deployment_target: environment

# The default would be /platform-edge/q/health/ready, derived from the name with the qits- prefix
# dropped. The edge owns the root path space and has no segment, so that path would be proxied to an
# environment gateway and 404 — the health gate would fail a perfectly healthy edge.
health_path: /q/health/ready
