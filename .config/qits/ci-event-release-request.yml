# THE QA PIPELINE — this repository's only pipeline besides the release recipe, and it runs for
# RELEASE REQUESTS ALONE. It replaces ci-event-build.yml and ci-event-userflows.yml, both deleted in
# the commit that added this file. The reference template with the full argument is qits-ci's
# docs/ci-event-release-request.yml.
#
# Per-push CI is retired platform-wide: nothing builds a branch, because cd deploys what a RELEASE
# published rather than what a push built. qits-projects keeps, per open release request, a backing
# branch `release/<id>` — an octopus merge of the request's sources, refolded whenever the set
# changes — and publishes `ReleaseRequestChanged` on every successful re-fold. That branch is
# written by qits-githost's merge primitive, which fires no post-receive and therefore publishes no
# `SCMPublishCommit`: without this event the fold exists and nothing builds it.
#
# DECIDE AT MAIN, BUILD AT THE FOLD. The file is discovered, parsed and selected at this
# repository's `main` head; only the run's branch and sha come from the payload. So a release
# request cannot alter the CI that gates it by folding in a commit that edits this file.
#
# ONE FILE, TWO HALVES, and "a red verify must not cost the image" still holds — bought with
# ORDERING plus PER-STEP CLASSIFICATION rather than with two files that cannot share a verdict. The
# gating build is FIRST; the userflow half declares `gating: false`, which still fails the run and
# shows red but does not hold the fold for qits-projects' build gate. Keep it LAST: everything after
# a failing step is SKIPPED.
#
# THE SHA IMAGE IS GONE. The old build step ended in `docker push
# $QITS_REGISTRY/$QITS_IMAGE_REPOSITORY/qits-platform-edge:$QITS_CI_SHA`, the per-push coordinate cd
# keyed on; a fold's merged sha is not a coordinate anything could deploy. The image is still BUILT
# here under a local tag, which is what gates the fold: this Dockerfile's builder stage is where
# this repository compiles at all. The CalVer coordinate is ci-event-release.yml's, untouched.
#
# THE MAINTENANCE RELEASE DOOR IS NOT HERE AND IS NOT MISSING. ci-event-build.yml ended in a
# dangling comment about a `maintenance/*` push asking qits-workspaces to release the branch; the
# step it described was already gone, and qits-maintenance asks the door itself now, with its own
# credential, on the push that creates the bump. Nothing about that path goes through CI.
#
# Loop review: this pipeline PUTs a docs bundle and pushes no commit, no tag and no image — nothing
# the fold is made of changes, so it cannot re-trigger itself. Publish-if-absent: events redeliver
# and docs versions are immutable, so 409 is success.
event: ReleaseRequestChanged

when:
  # repoName, not repoId: since the identity cutover the git host's own coordinate is an opaque
  # UUID, so a name match belongs on the name. The event echoes the public name; a rename updates
  # this line in the same campaign. `suppressCi` went with the push event that carried it — a
  # release request is not a push and `-o qits.no-ci` has nothing to say about one.
  - repoName: { exact: qits-edge-platform-service }

checkout:
  branch: backingBranch
  sha: mergedSha

steps:
  # --- the GATING half: build the fold ------------------------------------------------------------
  # ci-event-build.yml's step, minus the push.
  - image: qits/build-images/ci-base:latest
    docker: true
    timeout-seconds: 3600
    script: |
      # The daemon runs this with `bash -c` and no -e, so without this a failed docker build is
      # swallowed and the run reports SUCCESS — a green verdict for a fold that does not build is
      # exactly what a release gate must never be told. -u makes an unset registry variable stop the
      # step too.
      set -eu
      # $QITS_CI_BRANCH is release/<id> and $QITS_CI_SHA is the merged sha — the fold is already
      # checked out, so nothing here fetches or switches refs.
      #
      # The two --secret flags are the fleet's shape for a credential inside a build: the launcher
      # injects the run's commissioned idp client as
      # $QITS_COMMISSIONED_CLIENT_ID/$QITS_COMMISSIONED_CLIENT_SECRET, and a Dockerfile that needs it
      # mounts it on one RUN — never a --build-arg, which is recorded in a pullable image's history.
      # This build feeds them: the Dockerfile's mvnw RUN mounts the pair as the `qits-maven-network`
      # server credential behind `.qits-maven-settings.xml` — the answer to the registry's 401 once
      # reads are gated, unused literals until then. A run that commissioned nothing still builds
      # green: a missing env source is NOT an error (measured on buildx v0.36.1, the mounted
      # variable is simply unset).
      #
      # THE TAG IS LOCAL AND NOTHING IS PUSHED. `<registry>/<repository>/qits-platform-edge:<sha>`
      # was the per-push publication cd keyed on, and it is retired with the push path. The build
      # itself stays, because it is the gate. `docker: true` stays for the daemon socket the build
      # needs and for the pull auth the mirror-fronted base images need.
      ref="qits-platform-edge:$QITS_CI_SHA"
      docker build --network host \
        --build-arg QITS_MAVEN_REPOSITORY_URL="http://$QITS_REGISTRY/artifacts/maven/maven" \
        --build-arg QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_CENTRAL_MIRROR_URL:-}" \
        --secret id=qits-client-id,env=QITS_COMMISSIONED_CLIENT_ID \
        --secret id=qits-client-secret,env=QITS_COMMISSIONED_CLIENT_SECRET \
        -t "$ref" -f docker/Dockerfile .
      # NO `docker rmi "$ref"`: on a CI host it frees nothing — the layers stay in the builder's
      # cache either way — while under the containerd image store it drops the last reference to
      # content a concurrent build of this same Dockerfile may still be resolving.

  # --- the NON-GATING half: verify the stories, and publish what the run observed -----------------
  # ci-event-userflows.yml's step, unchanged but for `gating: false`, which is the whole of what that
  # separate file was.
  #
  # `mvn verify` at the fold — which regenerates service/target/userstories/ through the story
  # catalogue named below — and the reports published as one docs bundle, site
  # @userflows/qits-edge-platform-service, version = the merged sha, branch riding as artifacts
  # metadata for discovery.
  #
  # ONE STEP, BECAUSE STEPS SHARE NOTHING. Every step container clones the repository for itself, so
  # the gating step above cannot hand this one anything: the verify and the publish stay together.
  #
  # THE PUBLIC NAME IS `qits-edge-platform-service`, both in the selection above and in the bundle
  # name below, and it is what ci-event-release.yml already selects on (`repository: { exact:
  # qits-edge-platform-service }`). It is not the storage id — that is an opaque UUID since the
  # identity cutover — and it is not the checkout directory either: a bundle named after the
  # directory would be published where nothing looks for it.
  #
  # WHAT THE STORIES ARE, and why this repository's are the ones the whole fleet leans on. Half the
  # platform's CLAUDE.md files contain some version of the sentence "the edge asserts X-Qits-User /
  # X-Qits-User-Id / X-Qits-Roles and every service behind it believes them unconditionally". Every one
  # of those services tests the BELIEVING half against headers its own suite wrote. THIS is the
  # repository where the asserting half is true, and these nine stories are the proof of it against a
  # LAUNCHED artifact with the browser gate switched on — every claim asserted on the RECEIVING side's
  # own recording, which is what makes each one a fact about the bytes a service would have believed
  # rather than about a status code this process chose.
  #
  #   edge/ (9 stories, one launched artifact, one StoryProfile)
  #     ForwardAuthBootstrapIT   a forged identity never reaches the service, and the one idp vouched
  #                              for does — refused in both shapes a caller can act on (a login
  #                              redirect, the WWW-Authenticate challenge docker reads), then served
  #                              with the forgeries replaced; and the door serves nothing while health
  #                              is never gated.
  #     VhostRoutingIT           one path, one cookie, one browser, TWO names — and two different
  #                              services each hold exactly one recording of it. There is no path
  #                              knowledge in this process at all.
  #     SessionlessWallIT        four callers with no credential, four services up and answering, and
  #                              assertNoEdgesFrom(qits-edge-platform-service): NOTHING left the process.
  #     AnonymousReadIT          the half that broke once — a read a deployment opened asserts no
  #                              identity, so it must still empty the reserved namespace, and a
  #                              person's parent-domain cookie must not reach a machine vhost.
  #     SpaFreshnessIT           the Cache-Control rewrite qits-gateway carried and this process did
  #                              not when it replaced it: the SPA document revalidates, the
  #                              content-hashed bundle keeps its year, and a header the upstream chose
  #                              is untouched. A green deployed release that stayed invisible for a day
  #                              is what that defect looked like.
  #     UpstreamOutageIT         a container that goes away mid-request, and a name configured to point
  #                              at nothing: both are ANSWERS. Silence is the failure the bounded pool,
  #                              the bounded wait queue and the acquisition timeout exist to prevent.
  #     StreamingPassthroughIT   the two long-lived planes — a spliced WebSocket (the one path that
  #                              never installs the interceptor chain, and the one a forged identity
  #                              used to cross on) and a chunked answer whose first half must arrive
  #                              before the second was written.
  #
  # THE GATE IS FLIPPED IN THE IT'S PROFILE, NOT HERE AND NOT IN THE SHIPPED CONFIG.
  # `qits.edge.sessions.enabled` ships FALSE on purpose — the gate landed before idp could issue a
  # session, so it is inert until a deployment turns it on — and the IT hands the launched process
  # `true` plus the idp client credential the startup check demands, as -D arguments on an artifact that
  # was already built. Nothing in the repository's shipped defaults moves.
  #
  # `user: build`, and NOT a switch inside the script: both halves of this run spawn zonky's embedded
  # postgres — the surefire suite for the routing projection and the claim ledger, and the IT for the
  # two databases it hands the launched artifact through the platform's generic resource triple —
  # initdb refuses to run as root and calls getpwuid, so the step needs a passwd-backed non-root user.
  # maven-base carries one (uid 1001), with cap-drop=ALL and no su to undo it, which nothing here wants.
  # The step containers are Alpine, which is why service/pom.xml names zonky's -alpine binaries as a
  # fourth arch. The `acme` module has no test database and names none. qits-eventstream's pipeline is
  # the measured precedent for all of it.
  #
  # NO QUINOA FLAG, unlike most siblings' copy of this file. `-Dquarkus.quinoa=false` is there to keep a
  # step with an EMPTY webui submodule from failing on it; this repository has no webui, no submodule and
  # no Quinoa extension at all — five runtime extensions, and the shortness of that list is the point of
  # this service (see service/pom.xml). A flag for an extension this build does not have would only read
  # as if it did.
  #
  # THE TWO IT FLAGS ARE THE OTHER HALF. `skipITs` is true in service/pom.xml and stays true, and this
  # repository does not opt its ITs back in from the pom the way qits-docs and qits-stt do — not because
  # there is a heavyweight sibling IT to keep out (the story catalogue is the whole of the integration
  # suite), but because of what it would do to the build a clone runs. README.md documents
  # `./mvnw verify` as "unit tests + the end-to-end proxy suite (no docker, no network)", and that build
  # is already the heaviest of its kind: the surefire half forks TWO JVMs, because EdgeSessionGateTest
  # needs a Quarkus of its own to prove the gate's other state, and spawns a real postgres. Adding a
  # launched front door plus a SECOND embedded postgres — failsafe forks its own JVM, so the suite's
  # cannot be reused — would change that build for everybody to run what this pipeline runs anyway.
  #
  # THE LIST BELOW IS THE ONE PLACE A NEW STORY CLASS BECOMES REAL. A class that is written and not
  # added here compiles, passes review, and is never run — the failure mode is silence, so the list and
  # the class arrive in the SAME commit. It is a comma list, which is what -Dit.test takes; the order in
  # it does not decide execution order (UserflowClassOrderer does, from @UserflowRunsAfter), but keeping
  # ForwardAuthBootstrapIT first matches the order the classes actually run in and reads better.
  - image: qits/build-images/maven-base:latest
    user: build
    gating: false
    timeout-seconds: 2400
    script: |
      set -eu
      # The platform registry, exactly as qits-eventstream's step derives it: the pom's default
      # names a host-published address unreachable from a step container, and the exact-id mirror
      # in .qits-maven-settings.xml is what passes Maven's HTTP blocker.
      export QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL"
      # Maven Central through the platform mirror's in-network alias — empty (an older qits-ci that
      # injects nothing, or a deployment that turned the mirror plane off) deactivates the settings
      # profile and Central is resolved directly.
      export QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}"
      ./mvnw -B -ntp -s .qits-maven-settings.xml verify \
        -Dqits.maven.repository.url="$QITS_MAVEN_REPOSITORY_URL" \
        -DskipITs=false \
        "-Dit.test=ForwardAuthBootstrapIT,AnonymousReadIT,SessionlessWallIT,SpaFreshnessIT,StreamingPassthroughIT,UpstreamOutageIT,VhostRoutingIT"
      # `-C … .` so the story directories are the bundle's roots — nesting one directory deep would
      # put it in every served URL. The path is service/target/userstories because the stories live
      # in the one module that packages an artifact to boot; the `acme` module beside it is a plain
      # library jar with no application in it.
      tar -czf userstories.tgz -C service/target/userstories .
      # Branch and commit ride as metadata (the docs store's exact-match discovery keys); the
      # version is the merged sha itself, so a bundle URL never changes meaning.
      status=$(curl -sS -o /tmp/docs-publish.out -w '%{http_code}' \
        -X PUT --data-binary @userstories.tgz \
        -H "X-Artifacts-Meta-git.branch.name: $QITS_CI_BRANCH" \
        -H "X-Artifacts-Meta-git.commit.hash: $QITS_CI_SHA" \
        -H "X-Artifacts-Meta-git.repository.name: qits-edge-platform-service" \
        "$QITS_DOCS_URL/@userflows/qits-edge-platform-service/-/$QITS_CI_SHA")
      case "$status" in
        201) echo "published userflows for qits-edge-platform-service@$QITS_CI_SHA ($QITS_CI_BRANCH)" ;;
        409) echo "userflows for qits-edge-platform-service@$QITS_CI_SHA already published — skipping" ;;
        *)   echo "docs publish failed: HTTP $status"; cat /tmp/docs-publish.out; exit 1 ;;
      esac
